<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="18" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)" transform="translate(110, 50)">
    <!-- Power bank body -->
    <rect x="0" y="0" width="180" height="300" rx="24" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Edge highlight -->
    <rect x="4" y="4" width="172" height="292" rx="20" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Digital percentage display circle / screen -->
    <rect x="40" y="40" width="100" height="48" rx="12" fill="url(#screenGrad)" stroke="#1e293b"/>
    <!-- LED 100% -->
    <text x="80" y="72" text-anchor="middle" fill="#10b981" font-family="-apple-system, monospace" font-size="22" font-weight="900" letter-spacing="1">100%</text>
    <circle cx="122" cy="65" r="3" fill="#10b981"/>
    
    <!-- 20000mAh Badge -->
    <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">20000mAh</text>
    <text x="90" y="180" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">TWO-WAY FAST CHARGE</text>
    
    <!-- UGREEN Logo text -->
    <text x="90" y="250" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="2">UGREEN</text>
    
    <!-- Top ports detail indication -->
    <rect x="50" y="2" width="24" height="4" rx="2" fill="#0f172a"/>
    <rect x="105" y="2" width="24" height="4" rx="2" fill="#0f172a"/>
  </g>
</svg>
