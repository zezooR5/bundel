<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="caseGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="stemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background transparent -->
  <!-- Earbuds Charging Case -->
  <g filter="url(#shadow)">
    <!-- Case body -->
    <rect x="110" y="140" width="180" height="150" rx="60" fill="url(#caseGlow)"/>
    <!-- Lid seam line -->
    <path d="M 112 205 Q 200 215 288 205" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
    <!-- LED indicator -->
    <circle cx="200" cy="235" r="4.5" fill="#10b981"/>
    <!-- Subtle UGREEN branding -->
    <text x="200" y="260" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">UGREEN</text>
    
    <!-- Left Earbud popping out -->
    <g transform="translate(130, 75) rotate(-15)">
      <rect x="0" y="30" width="18" height="55" rx="9" fill="url(#stemGlow)"/>
      <circle cx="9" cy="22" r="22" fill="url(#stemGlow)"/>
      <circle cx="9" cy="22" r="14" fill="#f1f5f9"/>
      <rect x="6" y="70" width="6" height="8" rx="2" fill="#d97706"/>
    </g>
    
    <!-- Right Earbud popping out -->
    <g transform="translate(250, 75) rotate(15)">
      <rect x="0" y="30" width="18" height="55" rx="9" fill="url(#stemGlow)"/>
      <circle cx="9" cy="22" r="22" fill="url(#stemGlow)"/>
      <circle cx="9" cy="22" r="14" fill="#f1f5f9"/>
      <rect x="6" y="70" width="6" height="8" rx="2" fill="#d97706"/>
    </g>
  </g>
</svg>
