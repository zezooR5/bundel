<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="16" stdDeviation="16" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ganGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)" transform="translate(100, 80)">
    <!-- Charger body (cube/block) -->
    <rect x="20" y="20" width="160" height="180" rx="16" fill="url(#chargerBody)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- GaN 45W badge -->
    <rect x="40" y="45" width="60" height="22" rx="6" fill="url(#ganGlow)"/>
    <text x="70" y="60" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">GaN 45W</text>
    
    <!-- UGREEN Logo text -->
    <text x="100" y="110" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5">UGREEN</text>
    
    <!-- USB-C Port 1 -->
    <rect x="75" y="130" width="50" height="14" rx="7" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <rect x="90" y="135" width="20" height="4" rx="2" fill="#10b981"/>
    <text x="100" y="156" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8" font-weight="700">USB-C1 (45W)</text>

    <!-- USB-C Port 2 -->
    <rect x="75" y="165" width="50" height="14" rx="7" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <rect x="90" y="170" width="20" height="4" rx="2" fill="#38bdf8"/>
    
    <!-- Foldable / Wall plug prongs on left -->
    <rect x="0" y="70" width="20" height="12" rx="3" fill="#94a3b8"/>
    <rect x="0" y="120" width="20" height="12" rx="3" fill="#94a3b8"/>
  </g>
</svg>
